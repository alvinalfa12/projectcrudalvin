<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CRUD Produk</title>
</head>
<body style="background-color: rgb(76, 0, 255); color: white;">
    <h2>Tambah Kategori</h2>
    <form>
        <input type="text" placeholder="Nama Kategori">
        <button type="submit">Tambah Kategori</button>
    </form>

    <h2>Tambah Produk</h2>
    <form>
        <input type="text" placeholder="Nama Produk">
        <input type="text" placeholder="Harga">
        <input type="text" placeholder="ID Kategori">
        <button type="submit">Tambah Produk</button>
    </form>

    <h2>Daftar Produk</h2>
    <button>Muatt Data</button>
    <table border="1">
        <tr><th>ID</th><th>Nama</th><th>Harga</th><th>Kategori</th></tr>
        <!-- data akan dimasukkan melalui JavaScript -->
    </table>
</body>
</html>
